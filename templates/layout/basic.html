{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <script src="{% static 'plugins/jquery/jq-3.6.js' %}"></script>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap/bootstrap.css' %}">
    <link rel='stylesheet' href="{% static 'plugins/font-awesome/css/font-awesome.min.css' %}">
    <script src="{% static 'plugins/bootstrap/bootstrap.js' %}"></script>

    <style>
        /* ---- 核心：导航栏高度与垂直居中 ---- */
        .navbar {
            min-height: 60px; /* 导航栏高 */
            margin-bottom: 0;
        }

        /* 使用标准的 navbar-brand 容器放 logo，便于 bootstrap 兼容 */
        .navbar-brand {
            padding: 10px 15px; /* 控制左右间距与纵向空间 */
            height: 70px; /* 与 navbar 的 min-height 保持一致 */
            display: inline-block;
        }

        .navbar-brand img {
            height: 50px; /* logo 高度（可按需改） */
            display: inline-block;
            vertical-align: middle;
        }

        /* 导航链接垂直居中 */
        .navbar-nav > li > a,
        .navbar-right > li > a,
        .navbar .dropdown-toggle {
            line-height: 70px; /* 与 navbar 高度一致 */
            padding-top: 0;
            padding-bottom: 0;
            color: #4573a7 !important;
        }

        /* 下拉菜单项恢复默认高度（下拉内容不要被 line-height 影响） */
        .navbar .dropdown-menu > li > a {
            line-height: normal;
        }

        /* 小屏幕（折叠后的菜单）不要用大行高，避免菜单间距过大 */
        @media (max-width: 767px) {
            .navbar {
                min-height: auto;
            }

            .navbar-brand {
                height: auto;
                padding: 15px;
            }

            .navbar-brand img {
                height: 40px;
            }

            .navbar-nav > li > a,
            .navbar-right > li > a,
            .navbar .dropdown-toggle {
                line-height: normal;
                padding-top: 10px;
                padding-bottom: 10px;
            }
        }
    </style>

    {% block css %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-default">
    <div class="container">
        <div class="navbar-header">
            <!-- 折叠菜单按钮（移动端） -->
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                    data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <a class="navbar-brand" href="{% url "web:index" %}">
                <img src="{% static 'img/index/logo_top.png' %}" alt="logo">
            </a>
        </div>

        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1"
             style="font-size: 16px; font-weight: bold;">
            <ul class="nav navbar-nav">
                <!-- 左侧菜单（如有） -->
            </ul>

            {% if request.session.userinfo %}
                <ul class="nav navbar-nav navbar-right">
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button"
                           aria-haspopup="true" aria-expanded="false">
                            {{ request.session.userinfo.username }} <span class="caret"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a href="{% url 'web:manage_index' %}">项目管理</a></li>
                            <li role="separator" class="divider"></li>
                            <li><a href="{% url 'web:logout' %}">退出</a></li>
                        </ul>
                    </li>
                </ul>
            {% else %}
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="{% url 'web:login' %}">登录</a></li>
                    <li><a href="{% url 'web:register' %}">注册</a></li>
                </ul>
            {% endif %}
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function notNeedCsrf(method) {
        return (/^(GET|HEAD|OPTIONS|TRACE)$/i).test(method)
    }

    $.ajaxSetup({
        beforeSend: function (xhr, settings) {
            if (!notNeedCsrf(settings.type)) {
                xhr.setRequestHeader('X-CSRFTOKEN', getCookie('csrftoken'))
            }
        }
    });
</script>

{% block js %}{% endblock %}
</body>
</html>
