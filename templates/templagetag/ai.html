{# 聊天对话窗 #}
<div id="ai-chat-container">
    <div id="ai-chat-box">
        <div class="chat-header">
            <h3>
                <i class="fa fa-robot"></i> AI 助手
            </h3>
            <div class="chat-header-actions">
                <button class="chat-header-btn" id="ai-toggle-chat" title="折叠/展开">
                    <i class="fa fa-chevron-down"></i>
                </button>
                <button class="chat-header-btn" id="ai-clear-chat" title="清空对话">
                    <i class="fa fa-trash"></i>
                </button>
            </div>
        </div>
        <div id="ai-chat-messages">
            <div class="empty-state">
                <i class="fa fa-comments"></i>
                <div>我是您的AI助手，有什么可以帮您的？</div>
            </div>
        </div>
        <div id="ai-chat-input">
            <input type="text" id="ai-question" placeholder="输入您的问题..."/>
            <button id="ai-send-btn">发送</button>
        </div>
    </div>
</div>
