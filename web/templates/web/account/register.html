{% extends 'layout/basic.html' %}

{% block title %}注册{% endblock %}
{% block css %}
    <style>
        .register-form {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .register-form h2 {
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group .btn {
            width: 100%;
        }

        .form-group .input-group {
            width: 100%;
        }

        .error_msg {
            color: red;
            position: absolute;
        }

        .left {
            left: 0;
        }
    </style>
{% endblock %}
{% block content %}

    <div class="container">
        <form class="register-form" id="id_form">
            <h2>用户注册</h2>
            {% for item in form %}
                {% if item.name == 'phone' %}
                    <div class="form-group" style="margin-bottom: 25px;">
                        <label for="{{ item.id_for_label }}">{{ item.label }}</label>
                        <div class="input-group">
                            {{ item }}
                            <span class="input-group-btn">
                              <button class="btn btn-default" type="button" id="getCodeBtn">获取验证码</button>
                            </span>
                            <div>
                                <span id='id_error_{{ item.name }}' class="error_msg left"></span>
                            </div>
                        </div>
                    </div>
                {% else %}
                    <div class="form-group" style="margin-bottom: 22px;">
                        <label for="{{ item.id_for_label }}">{{ item.label }}</label>
                        {{ item }}
                        <span id='id_error_{{ item.name }}' class="error_msg"></span>
                    </div>
                {% endif %}
            {% endfor %}

            <button style="margin-top:12px;" class="btn btn-primary" id="id_btn_submit">注册</button>
        </form>


    </div>
{% endblock %}

{% block js %}
    <script>
        $(function () {
            // 全局变量
            window.sys_val = {
                sid: null,
                timeout: 5,
                msg_prefix: '已发送 ',
                msg_source: '获取验证码',
            }
            // 事件绑定
            bind_getcodebtn()
            bindCleanError()
            bindSubmitBtn()
        })

        // 倒计时
        function countdown() {
            const $getCodeBtn = $('#getCodeBtn')
            if (sys_val.timeout === 0) {
                // 状态重置
                clearInterval(sys_val.sid)
                $getCodeBtn.attr('disabled', false)
                $getCodeBtn.text(sys_val.msg_source)
                sys_val.timeout = 5
                sys_val.sid = null
            } else {
                $getCodeBtn.text(sys_val.msg_prefix + sys_val.timeout--)
            }

        }

        // 发送验证码
        function bind_getcodebtn() {
            $('#getCodeBtn').click(function () {
                let phone = $('#id_phone').val()
                $('#id_error_phone').text('')
                $.ajax({
                    url: "{% url 'web:send_sms' %}",
                    type: 'POST',
                    data: {'phone': phone},
                    dataType: 'JSON',
                    success: function (res) {
                        if (res.status) {
                            alert('发送成功')
                            const $getCodeBtn = $('#getCodeBtn')
                            $getCodeBtn.attr('disabled', true)
                            if (!sys_val.sid) {
                                sys_val.sid = setInterval(countdown, 1000)
                            }
                        } else {
                            // 提示错误信息
                            for (const field_name in res.errors_or_data) {
                                $('#id_error_' + field_name).text(res.errors_or_data[field_name])
                            }
                        }
                    },
                    error: function () {
                        alert('操作失败')
                    }
                })
            })
        }

        // 错误提示清空
        function bindCleanError() {
            $('form input').click(function () {
                let name = $(this).attr('name')
                $('#id_error_' + name).text('')
            })
        }

        // 表单提交
        function bindSubmitBtn() {
            $('#id_btn_submit').click(function (e) {
                e.preventDefault()
                $.ajax({
                    url: "{% url 'web:register' %}",
                    data: $('#id_form').serialize(),
                    dataType: 'JSON',
                    type: 'POST',
                    success: function (res) {
                        if (!res.status) {
                            for (const field_name in res.errors_or_data) {
                                $('#id_error_' + field_name).text(res.errors_or_data[field_name])
                            }
                        } else {
                            window.location.href = res.errors_or_data
                        }
                    }
                })
            })
        }

    </script>
{% endblock %}
