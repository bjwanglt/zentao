{% extends 'layout/manage_view.html' %}
{% load static %}
{% load issue %}
{% block css %}
    <style>
        #panel-dynamics .panel-body {
            max-height: 350px;
            overflow-y: auto;
        }

        .table-right > tbody > tr > td.label-left {
            width: 90px;
        }

        .table-right > tbody > tr > td {
            border: 0;
        }

        .status-count {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status-count .count {
            font-size: 25px;
        }

        .status-count a {
            text-decoration: none;
        }

        .user-item .title {
            margin-bottom: 20px;
        }

        .user-item .avatar, .top-10 .avatar {
            float: left;
            margin-right: 10px;
            display: inline-block;
            width: 30px;
            height: 30px;
            background-color: #304659;
            color: white;
            text-align: center;
            line-height: 30px;
            border-radius: 50%;
        }

        .user-item .text {
            line-height: 30px;
        }

        .top-10 .avatar {
            margin-right: 0;
        }

        .top-10 td {
            padding: 5px 10px;
        }

        .top-10 .table > tbody > tr > td {
            border-top: 0;
            border-bottom: 1px solid #ddd;
        }

        /* 新增：筛选控件样式 */
        .panel-filter {
            display: inline-flex;
            gap: 10px;
            margin-left: 15px;
            align-items: center;
        }

        .filter-select {
            font-size: 12px;
            padding: 4px 8px;
            height: 28px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            min-width: 100px;
            transition: all 0.2s ease;
        }

        .filter-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .filter-label {
            font-size: 12px;
            color: #666;
            margin-right: 2px;
            white-space: nowrap;
        }

        .filter-btn {
            padding: 4px 12px;
            height: 28px;
            font-size: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        .filter-btn:active {
            transform: translateY(0);
        }

        .panel-refresh {
            transition: transform 0.5s ease;
        }

        .panel-refresh.fa-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 响应式调整 */
        @media (max-width: 1200px) {
            .panel-filter {
                flex-direction: column;
                gap: 5px;
                margin-left: 10px;
            }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container-fluid" style="margin-top: 20px;">
        <div class="row">
            <div class="col-md-8">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <i class="fa fa-bar-chart" aria-hidden="true"></i>
                        新增问题趋势
                        <div class="pull-right" style="display: flex; align-items: center; gap: 10px;">
                            <div class="panel-filter">
                                <span class="filter-label">版本:</span>
                                <select class="filter-select" id="trendVersionFilter">
                                </select>
                                <span class="filter-label">需求:</span>
                                <select class="filter-select" id="trendDemandFilter">
                                </select>
                            </div>
                            <i class="fa fa-refresh panel-refresh" style="cursor:pointer;" title="刷新"
                               id="refresh_trend"></i>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div id="chart" style="width:100%;min-height:200px"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="panel panel-default">
                            <div class="panel-heading">
                                <i class="fa fa-quora" aria-hidden="true"></i>
                                问题
                                <div class="pull-right" style="display: flex; align-items: center; gap: 10px;">
                                    <div class="panel-filter">
                                        <span class="filter-label">版本:</span>
                                        <select class="filter-select" id="issueVersionFilter">
                                            <option value="">所有版本</option>
                                            <option value="v1.0">v1.0</option>
                                            <option value="v1.1">v1.1</option>
                                            <option value="v2.0">v2.0</option>
                                        </select>
                                        <span class="filter-label">需求:</span>
                                        <select class="filter-select" id="issueDemandFilter">
                                            <option value="">所有需求</option>
                                            <option value="demand1">用户管理</option>
                                            <option value="demand2">权限系统</option>
                                            <option value="demand3">报表功能</option>
                                        </select>
                                    </div>
                                    <i class="fa fa-refresh panel-refresh" style="cursor:pointer;" title="刷新"
                                       id="refresh_issue_group"></i>
                                </div>
                            </div>
                            <div class="panel-body" id="panel-issue_group"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="panel panel-default">
                            <div class="panel-heading">
                                <i class="fa fa-user" aria-hidden="true"></i>
                                项目成员
                                <i class="fa fa-refresh panel-refresh pull-right" style="cursor:pointer;" title="刷新"
                                   id="refresh_members"></i>
                            </div>
                            <div class="panel-body user-item">
                                <div class="col-sm-12 title">创建者</div>
                                <div class="clearfix" style="margin-bottom: 30px;" id="members_creater"></div>
                                <div class="col-sm-12 title">参与者</div>
                                <div id="members_joiner"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <div class="col-md-4">
                <div class="panel panel-default" id="panel-detail">
                    <div class="panel-heading">
                        <i class="fa fa-cog title-icon"></i>
                        详细
                        <i class="fa fa-refresh panel-refresh pull-right" style="cursor:pointer;" title="刷新"
                           id="refresh_detail"></i>
                    </div>
                    <div class="panel-body">
                        <table class="table table-right">
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="panel panel-default" id="panel-dynamics">
                    <div class="panel-heading">
                        <i class="fa fa-list-ul" aria-hidden="true"></i>
                        动态
                        <i class="fa fa-refresh panel-refresh pull-right" style="cursor:pointer;" title="刷新"
                           id="refresh_dynamics"></i>
                    </div>
                    <div class="panel-body top-10">
                        <table class="table">
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
{% endblock %}

{% block js %}
    <script src="{% static 'plugins/highcharts/highcharts.js' %}"></script>
    <script>
        $(function () {
            // 初始化下拉选
            init_select()
            bind_refresh()
            // 刷新详情数据
            refresh_detail_data()
            // 刷新动态
            refresh_dynamics()
            // 刷新问题分组
            refreshIssueGroupData()
            // 刷新项目成员
            refresh_members()
            // 刷新问题趋势
            Highcharts.setOptions({
                global: {
                    useUTC: false
                }
            });
            initChart();
        })

        function init_select() {
            const versions = {{ optioin_version|safe }}
                // 版本下拉选 - 趋势
                $('#trendVersionFilter').html('')
            $('#trendVersionFilter').append(
                `<option value="">全部版本</option>`
            )
            for (const version of versions) {
                $('#trendVersionFilter').append(
                    `<option value="${version.id}">${version.name}</option>`
                )
            }

            // 版本下拉选 - 问题
            $('#issueVersionFilter').html('')
            $('#issueVersionFilter').append(
                `<option value="">全部版本</option>`
            )
            for (const version of versions) {
                $('#issueVersionFilter').append(
                    `<option value="${version.id}">${version.name}</option>`
                )
            }

            const demands = {{ optioin_demand|safe }}
                $('#trendVersionFilter').change(function () {
                    const current_version = $(this).val()
                    $('#trendDemandFilter').html('')
                    $('#trendDemandFilter').append(
                        `<option value="">全部需求</option>`
                    )
                    for (const demand of demands) {
                        console.log(demand)
                        if (String(demand.version) === String(current_version)) {
                            $('#trendDemandFilter').append(
                                `<option value="${demand.id}">${demand.name}</option>`
                            )
                        }
                    }
                })

            $('#issueVersionFilter').change(function () {
                const current_version = $(this).val()
                $('#issueDemandFilter').html('')
                $('#issueDemandFilter').append(
                    `<option value="">全部需求</option>`
                )
                for (const demand of demands) {
                    console.log(demand)
                    if (String(demand.version) === String(current_version)) {
                        $('#issueDemandFilter').append(
                            `<option value="${demand.id}">${demand.name}</option>`
                        )
                    }
                }
            })

            // 需求下拉选 - 趋势
            $('#trendDemandFilter').html('')
            $('#trendDemandFilter').append(
                `<option value="">全部需求</option>`
            )
            // 需求下拉选 - 问题
            $('#issueDemandFilter').html('')
            $('#issueDemandFilter').append(
                `<option value="">全部需求</option>`
            )


        }


        // 筛选状态
        let currentFilters = {
            version: '',
            demand: ''
        };


        // 旋转效果
        function spinIcon($icon) {
            if ($icon.hasClass('fa-spin')) return;
            $icon.addClass('fa-spin');
            setTimeout(() => {
                $icon.removeClass('fa-spin');
            }, 800);
        }

        function initChart() {
            let config = {
                title: {text: null},
                legend: {enabled: false},
                credits: {enabled: false},
                yAxis: {title: {text: '问题数量'}},
                xAxis: {
                    type: 'datetime',
                    tickInterval: 60 * 60 * 24 * 1000,
                    labels: {
                        formatter: function () {
                            return Highcharts.dateFormat('%m-%d', this.value);
                        },
                        rotation: -30
                    }
                },
                tooltip: {
                    headerFormat: '<b>{point.key}</b><br>',
                    pointFormat: '<span style="color:{series.color}">\u25CF</span> 数量: {point.y} ',
                    xDateFormat: '%Y-%m-%d',
                },
                plotOptions: {
                    area: {
                        stacking: 'normal',
                        lineColor: '#666666',
                        lineWidth: 1,
                        marker: {
                            lineWidth: 1,
                            lineColor: '#666666'
                        }
                    }
                },
                series: [{data: []}]
            };
            refreshTrendData(config);
        }

        // 刷新趋势数据（带筛选）
        function refreshTrendData(config) {
            if (!config) {
                config = window.trendChart ? window.trendChart.options : null;
            }
            $.ajax({
                url: '{% url 'web:overview' pid=request.proid %}' + '?data_type=trend',
                type: "GET",
                dataType: "JSON",
                data: {
                    'version': $('#trendVersionFilter').val(),
                    'demand': $('#trendDemandFilter').val(),
                },
                success: function (res) {
                    if (res.status) {
                        if (config) {
                            config.series[0].data = res.errors_or_data;
                            if (window.trendChart) {
                                window.trendChart.update(config);
                            } else {
                                window.trendChart = Highcharts.chart('chart', config);
                            }
                        }
                    }
                }
            });
        }

        // 刷新问题分组数据（带筛选）
        function refreshIssueGroupData() {
            $.ajax({
                url: '{% url 'web:overview' pid=request.proid %}' + '?data_type=issue_group',
                type: 'GET',
                dataType: 'JSON',
                data: {
                    'version': $('#issueVersionFilter').val(),
                    'demand': $('#issueDemandFilter').val(),
                },
                success: function (res) {
                    if (res.status) {
                        const $tbody = $('#panel-issue_group');
                        $tbody.empty();
                        for (const item of res.errors_or_data) {
                            $tbody.prepend(get_issue_tag(item));
                        }
                    } else {
                        alert('【问题分组】数据加载失败')
                    }
                }
            });
        }

        function bind_refresh() {
            $(document).on('click', '.panel-refresh', function () {
                const $icon = $(this);
                const id = $icon.attr('id')
                spinIcon($icon);

                if (id === 'refresh_detail') {
                    refresh_detail_data()
                }
                if (id === 'refresh_dynamics') {
                    refresh_dynamics()
                }
                if (id === 'refresh_issue_group') {
                    refreshIssueGroupData()
                }
                if (id === 'refresh_members') {
                    refresh_members()
                }
                if (id === 'refresh_trend') {
                    refreshTrendData()
                }
            });
        }

        function refresh_members() {
            $.ajax({
                url: '{% url 'web:overview' pid=request.proid %}' + '?data_type=members',
                type: 'GET',
                dataType: 'JSON',
                success: function (res) {
                    if (res.status) {
                        const $creater = $('#members_creater');
                        const $joiner = $('#members_joiner');
                        $creater.empty();
                        $joiner.empty();
                        for (const item of res.errors_or_data.data_creater) {
                            $creater.prepend(get_members_creater_tag(item));
                        }
                        for (const item of res.errors_or_data.data_joiner) {
                            $joiner.prepend(get_members_joiner_tag(item));
                        }
                    } else {
                        alert('【成员】数据加载失败')
                    }
                }
            })
        }

        function get_members_creater_tag(item) {
            return $(`
                <div class="col-sm-4">
                    <div class="avatar">${item.user_avatar}</div>
                    <div class="text">${item.user_name}</div>
                </div>
            `)
        }

        function get_members_joiner_tag(item) {
            return $(`
                <div class="col-sm-4">
                    <div class="avatar">${item.user_avatar}</div>
                    <div class="text">${item.user_name}</div>
                </div>
            `)
        }

        function get_issue_tag(item) {
            return $(`
            <div class="col-sm-4 status-count">
                <a href="/account/manage/${item.project_id}/issue/?status=${item.status}">
                        <div class="count">${item.num}</div>
                        <div>${item.status_text}</div>
                </a>
            </div>
            `)
        }

        function refresh_dynamics() {
            $.ajax({
                url: '{% url 'web:overview' pid=request.proid %}' + '?data_type=dynamics',
                type: 'GET',
                dataType: 'JSON',
                success: function (res) {
                    if (res.status) {
                        const $tbody = $('#panel-dynamics tbody');
                        $tbody.empty();
                        for (const item of res.errors_or_data) {
                            $('#panel-dynamics tbody').prepend(get_dynamics_tag(item));
                        }
                    } else {
                        alert('【动态】数据加载失败')
                    }
                }
            })
        }

        function get_dynamics_tag(item) {
            if (item.type === 1) {
                return $(`
                <tr>
                    <td style="width: 46px;">
                        <div class="avatar">${item.creator_initial}</div>
                    </td>
                    <td>
                        <div>${item.creator__username}</div>
                        <div>指派BUG
                            <a href="/account/manage/${item.project_id}/issue/detail/${item.id}/">#${item.id}</a>
                            给 ${item.assign__username}
                        </div>
                    </td>
                    <td style="width: 156px;">
                        ${item.create_time}
                    </td>
                </tr>
                `)
            } else {
                return $(`
                <tr>
                    <td style="width: 46px;">
                        <div class="avatar">${item.creator_initial}</div>
                    </td>
                    <td>
                        <div>${item.creater__username}</div>
                        <div>修改BUG
                            <a href="/account/manage/${item.project_id}/issue/detail/${item.issues_id}/">#${item.issues_id}</a>
                        </div>
                        <div>
                            修改内容: ${item.issues__desc}
                        </div>
                    </td>
                    <td style="width: 156px;">
                        ${item.create_time}
                    </td>
                </tr>
                `)
            }
        }

        function refresh_detail_data() {
            $.ajax({
                url: '{% url 'web:overview' pid=request.proid %}' + '?data_type=detail_data',
                type: 'GET',
                dataType: 'JSON',
                success: function (res) {
                    if (res.status) {
                        $('#panel-detail tbody').html(get_detail_tag(res.errors_or_data));
                    } else {
                        alert('【详细】数据加载失败')
                    }
                }
            })
        }

        function get_detail_tag(detail_data) {
            return `
                <tr>
                    <td class="label-left">项目名称 ：</td>
                    <td>${detail_data.p_name}</td>
                </tr>
                <tr>
                    <td class="label-left">项目描述 ：</td>
                    <td>${detail_data.p_desc}</td>
                </tr>
                <tr>
                    <td class="label-left">创建时间 ：</td>
                    <td>${detail_data.create_time}</td>
                </tr>
                <tr>
                    <td class="label-left">项目空间 ：</td>
                    <td>${detail_data.use_space} / ${detail_data.total_space}</td>
                </tr>
                <tr>
                    <td class="label-left">套餐版本 ：</td>
                    <td>${detail_data.set_menu}</td>
                </tr>
            `
        }
    </script>
{% endblock %}
