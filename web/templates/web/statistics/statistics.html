{% extends 'layout/manage_view.html' %}
{% load static %}
{% block css %}
    <link rel="stylesheet" href="{% static 'plugins/daterangepicker/daterangepicker.css' %}">
    <style>
        /* 新增：开关样式 */
        .switch-container {
            display: flex;
            align-items: center;
            margin-left: 15px;
        }

        .switch-label {
            font-size: 12px;
            color: #666;
            margin-right: 8px;
            white-space: nowrap;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #8feb7c;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* 新增：筛选控件样式 */
        .panel-filter {
            display: inline-flex;
            gap: 10px;
            margin-left: 15px;
            align-items: center;
        }

        .filter-select {
            font-size: 12px;
            padding: 4px 8px;
            height: 28px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            min-width: 100px;
            transition: all 0.2s ease;
        }

        .filter-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .filter-label {
            font-size: 12px;
            color: #666;
            margin-right: 2px;
            white-space: nowrap;
        }

        /* 新增：图表容器样式 */
        #priority, #projectUser {
            overflow: hidden;
        }

        .panel-body {
            overflow: hidden;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container-fluid" style="margin-top: 20px;">
        <div style="display: flex; align-items: center;">
            <div class="input-group" style="width: 300px;">
                <span class="input-group-addon">BUG创建时间</span>
                <input id="rangePicker" type="text" class="form-control" style="width: 101%">
            </div>
            <div class="switch-container">
                <span class="switch-label" style="font-size: 14px;">联动刷新</span>
                <label class="switch">
                    <input type="checkbox" id="includeSubVersion">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="row" style="margin-top: 20px;">
            <div class="col-md-8">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <i class="fa fa-bar-chart" aria-hidden="true"></i>
                        人员工作进度
                        <div class="pull-right" style="display: flex; align-items: center; gap: 10px;">
                            <div class="panel-filter">
                                <span class="filter-label">版本:</span>
                                <select class="filter-select" id="projectUserVersionFilter">
                                    <option value="">全部版本</option>
                                </select>
                                <span class="filter-label">需求:</span>
                                <select class="filter-select" id="projectUserDemandFilter">
                                    <option value="">全部需求</option>
                                </select>
                            </div>
                            <i class="fa fa-refresh panel-refresh pull-right"
                               style="cursor:pointer;" title="刷新" id="refresh_projectUser"></i>
                        </div>


                    </div>
                    <div class="panel-body">
                        <div id="projectUser" style="height: 300px;"></div>
                    </div>
                </div>

            </div>
            <div class="col-md-4">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <i class="fa fa-pie-chart" aria-hidden="true"></i>
                        优先级统计
                        <div class="pull-right" style="display: flex; align-items: center; gap: 10px;">
                            <div class="panel-filter">
                                <span class="filter-label">版本:</span>
                                <select class="filter-select" id="priorityVersionFilter">
                                    <option value="">全部版本</option>
                                </select>
                                <span class="filter-label">需求:</span>
                                <select class="filter-select" id="priorityDemandFilter">
                                    <option value="">全部需求</option>
                                </select>
                            </div>
                            <i class="fa fa-refresh panel-refresh pull-right"
                               style="cursor:pointer;" title="刷新" id="refresh_priority"></i>
                        </div>


                    </div>
                    <div class="panel-body">
                        <div id="priority" style="height: 300px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}

{% block js %}

    <script src="{% static 'plugins/daterangepicker/moment.min.js' %}"></script>
    <script src="{% static 'plugins/daterangepicker/daterangepicker.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <script>
        $(function () {
            window.link_flag = localStorage.getItem('link_refresh_flag') === 'true';
            bind_refresh()
            initDateRangePicker();
            priority(moment().startOf('year').format('YYYY-MM-DD'), moment().add(1, 'days').format('YYYY-MM-DD'));
            projectUser(moment().startOf('year').format('YYYY-MM-DD'), moment().add(1, 'days').format('YYYY-MM-DD'));
        });

        init_select()

        $('#includeSubVersion').change(function () {
            window.link_flag = $(this).is(':checked');
            localStorage.setItem('link_refresh_flag', window.link_flag);
        });

        function init_version(dom_id, sources){
            $(`#${dom_id}`).html('')
            $(`#${dom_id}`).append(
                `<option value="">全部版本</option>`
            )
            for (const version of sources) {
                $(`#${dom_id}`).append(
                    `<option value="${version.id}">${version.name}</option>`
                )
            }
        }

        function bind_demand_change(demand_dom){
            $(`#${demand_dom}`).change(function () {
                if(window.link_flag){
                    const n_ddom = demand_dom === 'priorityDemandFilter' ?'projectUserDemandFilter':'priorityDemandFilter'
                    $(`#${n_ddom}`).val($(`#${demand_dom}`).val())
                }
            })
        }

        function init_demand(demand_dom, sources, current_version){
            for (const demand of sources) {
                    if (String(demand.version) === String(current_version)) {
                        $(`#${demand_dom}`).append(
                            `<option value="${demand.id}">${demand.name}</option>`
                        )
                    }
                }
        }

        function bind_version_change(version_dom, demand_dom, sources){
            // projectUserVersionFilter  projectUserDemandFilter
            $(`#${version_dom}`).change(function () {
                const current_version = $(this).val()
                $(`#${demand_dom}`).html('')
                $(`#${demand_dom}`).append(
                    `<option value="">全部需求</option>`
                )
                init_demand(demand_dom, sources, current_version)

                if(window.link_flag){
                    const n_vdom = version_dom === 'projectUserVersionFilter' ?'priorityVersionFilter':'projectUserVersionFilter'
                    const n_ddom = demand_dom === 'priorityDemandFilter' ?'projectUserDemandFilter':'priorityDemandFilter'

                    $(`#${n_vdom}`).val($(this).val())

                    $(`#${n_ddom}`).html('')
                    $(`#${n_ddom}`).append(
                        `<option value="">全部需求</option>`
                    )
                    init_demand(n_ddom, sources, current_version)
                }
            })
        }

        function init_select() {
            // 版本下拉选 - 趋势
            const versions = {{ optioin_version|safe }};
            init_version('projectUserVersionFilter', versions)
            // 版本下拉选 - 问题
            init_version('priorityVersionFilter', versions)

            const demands = {{ optioin_demand|safe }};
            bind_version_change('projectUserVersionFilter','projectUserDemandFilter', demands)
            bind_version_change('priorityVersionFilter','priorityDemandFilter', demands)

            bind_demand_change('priorityDemandFilter')
            bind_demand_change('projectUserDemandFilter')
        }

        const API_URL = "{% url 'web:statistics' pid=request.proid%}";

        function initDateRangePicker() {
            var options = {
                startDate: moment().startOf('year'),
                endDate: moment(),
                maxDate: moment(),
                alwaysShowCalendars: true,
                showWeekNumbers: true,
                ranges: {
                    "今天": [moment(), moment()],
                    '昨天': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                    '最近7天': [moment().subtract(6, 'days'), moment()],
                    '最近30天': [moment().subtract(29, 'days'), moment()],
                    '本月': [moment().startOf('month'), moment().endOf('month')],
                    '今年': [moment().startOf('year'), moment().endOf('year')],
                },
                locale: {
                    format: 'YYYY-MM-DD',
                    separator: ' 至 ',
                    applyLabel: '确定',
                    cancelLabel: '取消',
                    fromLabel: '开始',
                    toLabel: '结束',
                    customRangeLabel: '自定义',
                    weekLabel: 'W',
                    daysOfWeek: ['一', '二', '三', '四', '五', '六', '日'],
                    monthNames: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'],
                    firstDay: 1
                }
            };

            $('#rangePicker').daterangepicker(options, function (start, end, label) {
                // 选择了时间之后，函数自动被触发。
                priority(start.format('YYYY-MM-DD'), end.clone().add(1, 'days').format('YYYY-MM-DD'));
                projectUser(start.format('YYYY-MM-DD'), end.clone().add(1, 'days').format('YYYY-MM-DD'));
            });
        }

        function priority(start, end, flag=true) {
            $.ajax({
                url: API_URL,
                type: "GET",
                data: {
                    start: start,
                    end: end,
                    data_type: 'priority',
                    version: $('#priorityVersionFilter').val(),
                    demand: $('#priorityDemandFilter').val()
                },
                dataType: "html",
                success: function (res) {
                    $('#priority').html(res);
                    if(flag && window.link_flag){
                        projectUser(start, end, false);
                    }
                }
            })
        }

        function projectUser(start, end, flag=true) {
            $.ajax({
                url: API_URL,
                type: "GET",
                data: {
                    start: start,
                    end: end,
                    data_type: 'projess',
                    version: $('#projectUserVersionFilter').val(),
                    demand: $('#projectUserDemandFilter').val()
                },
                dataType: "html",
                success: function (res) {
                    $('#projectUser').html(res);
                    if(flag && window.link_flag){
                        priority(start, end, false);
                    }
                }
            })
        }

        function bind_refresh() {
            $(document).on('click', '.panel-refresh', function () {
                const $icon = $(this);
                const id = $icon.attr('id')
                if ($icon.hasClass('fa-spin')) return;  // 防止重复点击
                $icon.addClass('fa-spin');
                // 模拟刷新延时2秒
                setTimeout(() => {
                    $icon.removeClass('fa-spin');
                }, 550);
                let picker = $('#rangePicker').data('daterangepicker');
                let start = picker.startDate.format('YYYY-MM-DD');
                let end = picker.endDate.clone().add(1, 'days').format('YYYY-MM-DD');
                if (id === 'refresh_priority') {
                    // 刷新优先级
                    priority(start, end);
                }
                if (id === 'refresh_projectUser') {
                    // 刷新进度
                    projectUser(start, end);
                }
            });
        }
    </script>
{% endblock %}
